<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Maklumat Kad Kahwin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f4f5f7; padding: 20px; color: #333; margin: 0; }
        .admin-card { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #8D7B68; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 5px; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-save { width: 100%; background: #8D7B68; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        .btn-secondary { width: 100%; background: #eee; color: #333; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 8px; text-decoration: none; display: block; text-align: center; }
        .status-msg { margin-top: 10px; text-align: center; font-size: 0.85rem; color: #28a745; display: none; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Editor Kad Kahwin Instant</h2>
    <form id="admin-form">
        <div class="grid-2">
            <div class="form-group">
                <label>Nama Ringkas Pengantin Lelaki</label>
                <input type="text" id="groom" required>
            </div>
            <div class="form-group">
                <label>Nama Ringkas Pengantin Perempuan</label>
                <input type="text" id="bride" required>
            </div>
        </div>

        <div class="form-group">
            <label>Tuan Rumah / Ibu Bapa</label>
            <input type="text" id="host" required>
        </div>

        <div class="form-group">
            <label>Turut Mengundang</label>
            <input type="text" id="specialInvite">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Tarikh Paparan</label>
                <input type="text" id="dateDisplay" required>
            </div>
            <div class="form-group">
                <label>Masa Jamuan</label>
                <input type="text" id="timeDisplay" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Masa Akad Nikah</label>
                <input type="text" id="nikahTime">
            </div>
            <div class="form-group">
                <label>Lokasi Akad Nikah</label>
                <input type="text" id="nikahLocation">
            </div>
        </div>

        <div class="form-group">
            <label>Alamat Penuh Majlis</label>
            <textarea id="hallAddress" rows="2" required></textarea>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Nama Bank (Salam Kaut)</label>
                <input type="text" id="bankName">
            </div>
            <div class="form-group">
                <label>No. Akaun Bank</label>
                <input type="text" id="bankAcc">
            </div>
        </div>

        <button type="submit" class="btn-save">Simpan Perubahan</button>
        <a href="index.html" target="_blank" class="btn-secondary">Buka Kad Kahwin (Pratonton)</a>
        <button type="button" id="btn-reset" class="btn-secondary" style="color: #dc3545;">Reset ke Asal</button>
        <div id="status" class="status-msg">Maklumat berjaya dikemas kini!</div>
    </form>
</div>

<script src="./js/config.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentConfig = getWeddingConfig();

        // Fill current form values
        document.getElementById('groom').value = currentConfig.groom;
        document.getElementById('bride').value = currentConfig.bride;
        document.getElementById('host').value = currentConfig.host;
        document.getElementById('specialInvite').value = currentConfig.specialInvite || '';
        document.getElementById('dateDisplay').value = currentConfig.dateDisplay;
        document.getElementById('timeDisplay').value = currentConfig.timeDisplay;
        document.getElementById('nikahTime').value = currentConfig.nikahTime || '';
        document.getElementById('nikahLocation').value = currentConfig.nikahLocation || '';
        document.getElementById('hallAddress').value = currentConfig.hallAddress;
        document.getElementById('bankName').value = currentConfig.bank.name;
        document.getElementById('bankAcc').value = currentConfig.bank.accountNo;

        // Save action
        document.getElementById('admin-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const updated = {
                ...currentConfig,
                groom: document.getElementById('groom').value,
                bride: document.getElementById('bride').value,
                shortName: `${document.getElementById('groom').value} & ${document.getElementById('bride').value}`,
                host: document.getElementById('host').value,
                specialInvite: document.getElementById('specialInvite').value,
                dateDisplay: document.getElementById('dateDisplay').value,
                timeDisplay: document.getElementById('timeDisplay').value,
                nikahTime: document.getElementById('nikahTime').value,
                nikahLocation: document.getElementById('nikahLocation').value,
                hallAddress: document.getElementById('hallAddress').value,
                bank: {
                    ...currentConfig.bank,
                    name: document.getElementById('bankName').value,
                    accountNo: document.getElementById('bankAcc').value
                }
            };

            localStorage.setItem('weddingCardConfig', JSON.stringify(updated));
            const status = document.getElementById('status');
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        });

        // Reset action
        document.getElementById('btn-reset').addEventListener('click', () => {
            if(confirm("Adakah anda pasti untuk reset semula maklumat ke tetapan asal?")) {
                localStorage.removeItem('weddingCardConfig');
                location.reload();
            }
        });
    });
</script>
</body>
</html>
